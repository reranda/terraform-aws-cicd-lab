name: Terraform Deploy

"on":
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the saved Terraform plan after planning"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_bucket_name: ${{ vars.DEMO_BUCKET_NAME }}
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Terraform Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload saved plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: infrastructure/tfplan
          retention-days: 1

  apply:
    name: Terraform Apply
    if: inputs.apply == true
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: dev

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-apply-${{ github.run_id }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Download saved plan
        uses: actions/download-artifact@v7
        with:
          name: terraform-plan
          path: infrastructure

      - name: Apply saved plan
        run: terraform apply -input=false tfplan
