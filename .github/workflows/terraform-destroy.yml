name: Terraform Destroy

"on":
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm destruction of the lab infrastructure"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_bucket_name: ${{ vars.DEMO_BUCKET_NAME }}
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    name: Terraform Destroy
    if: github.ref == 'refs/heads/main' && inputs.confirm_destroy == 'DESTROY'
    runs-on: ubuntu-latest
    environment:
      name: dev

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-destroy-${{ github.run_id }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Create destroy plan
        run: terraform plan -destroy -input=false -out=tfdestroy

      - name: Apply destroy plan
        run: terraform apply -input=false tfdestroy
